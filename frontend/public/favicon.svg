<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M256,32 L448,96 L448,224 C448,341 367,449 256,480 C145,449 64,341 64,224 L64,96 L256,32 Z" fill="url(#bgGrad)" />
  
  <!-- 3D Half-Shield Shadow -->
  <path d="M256,32 L448,96 L448,224 C448,341 367,449 256,480 Z" fill="#000000" opacity="0.15" />

  <!-- Gas / Air Detection Radar Arcs -->
  <path d="M 126 190 A 180 180 0 0 1 386 190" fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" />
  <path d="M 166 260 A 120 120 0 0 1 346 260" fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" />
  <path d="M 206 330 A 60 60 0 0 1 306 330" fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- Sensor Node / Alert Indicator -->
  <circle cx="256" cy="400" r="32" fill="#00FFEA" filter="url(#glow)" />
  <circle cx="256" cy="400" r="16" fill="#FFFFFF" />
</svg>